        const _id = `8207730831`;
        const template = `<div class="alert"><img src="{media}" class="media"><p class="template"><span class="wiggle">{amount}</span> <span class="from">{from_text}</span> <span class="wiggle">{supporter}</span></p><p class="message">{message}</p></div>`;
        const src = 'https://storage.sociabuzz.com/storage/img/gif/thanks.gif';
        const def_sound = `https://storage.sociabuzz.com/storage/img/suara_awal.mp3`;
        const duration_tag = `12000`;
        const gif_wave = `https://storage.sociabuzz.com/storage/img/gif/sound-wave.gif`;
        const el_wave = `<div id="gif_wave" class="wave" style="text-align: center;">

        function stopAllSounds() {
            soundSequence.forEach(sound => {
                try {
                    sound.pause();
                    sound.currentTime = 0;
                } catch (e) {}
            });
            soundSequence = [];
        }

        function resetOverlay() {
            if(overlay_timeout) {
                clearTimeout(overlay_timeout);
                overlay_timeout = undefined;
            }

            $('#main').hide();

            try {
                stopAllSounds();
            } catch (error) {
                console.log('Error stopping sounds:', error);
            }
        }

        function renderAlert(data) {
            let rendered = template
                .replace('{media}', data.final_media)
                .replace('{amount}', data.final_amount)
                .replace('{from_text}', data.final_from_text)
                .replace('{supporter}', data.final_supporter)
                .replace('{message}', data.final_message)
            
            $('#main')
                .hide()
                .html(rendered);

            if(!data.final_media) {
                $('.media').hide();
            }

            if(
                $('.media').attr('src') != 'undefined'
                && $('.media').attr('src') != ''
            ) {
                $('.media').show();
            } else {
                $('.media').hide();
            }

            if(data.display_wave) {
                $('#main>div').append(el_wave)
            }

            $('#main').show();
        }

        const customAlert = [{"custom_alert_id":"372769","tribe_profile_id":"759317","nominal":"200000","custom_type":"1","tts_active":"1","tts_text":"Wow","sound_active":"0","sound_file":"","gif_active":"1","gif_file":"","created_at":"2026-01-25 02:29:05"}];
        function get_custom_alert(nominal) {
            return customAlert.find(
                (a) => a.custom_type == '2' && nominal == parseInt(a.nominal) ||
                a.custom_type == '1' && nominal >= parseInt(a.nominal)
            );
        }

        function sound_new(length, tts = '', vn = '', sound_yes = '', is_custom = false, soundboard = null, callback = null) {
            let voice_note = vn;
            let sound_def;
            let sound_all;
            let sound_new;
            let newSound;

                            sound_all = tts;
                if (voice_note != null) {
                    if (sound_yes != '') {
                        sound_def = vn;
                        soundSequence = new Array(new Audio(sound_yes));

                        if (tts != '')
                            soundSequence.push(new Audio(tts));

                        if (sound_def != '')
                            soundSequence.push(new Audio(sound_def));
                    } else {
                        sound_def = vn;
                        soundSequence = [];

                        if (tts != '')
                            soundSequence.push(new Audio(tts));

                        if (sound_def != '')
                            soundSequence.push(new Audio(sound_def));
                    }
                } else if (sound_yes != "") {
                    soundSequence = new Array(new Audio(sound_yes));
                    if (tts != '')
                        soundSequence.push(new Audio(tts));
                } else {
                    soundSequence = [];

                    if (tts != '')
                        soundSequence.push(new Audio(tts));
                }
            
            if (is_custom && soundboard != null){
                var newSoundBoard = soundSequence.slice();
                newSoundBoard.unshift(new Audio(soundboard));
                soundSequence = newSoundBoard;
            }

            if (vn != '') {
                playSndVoiceNotes(i = -1);
            } else {
                playSnd(i = -1);
            }

            function playSndVoiceNotes(length) {
                i++;
                if (i == soundSequence.length) {
                    if(callback) {
                        return callback();
                    } else {
                        return;
                    }
                };
                soundSequence[i].addEventListener('ended', playSndVoiceNotes);
                if(soundSequence[i].error == null){
                    soundSequence[i].play();
                }else{
                    playSndVoiceNotes(i, tts);
                }
            }

            function playSnd(length) {
                i++;
                if (i == soundSequence.length) return;
                soundSequence[i].addEventListener('ended', playSnd);
                soundSequence[i].play();
                setTimeout(function() {
                    if (typeof soundSequence[i] !== 'undefined') {
                        soundSequence[i].pause();
                        soundSequence[i].currentTime = 0;
                    }
                }, duration_tag);

            }

                    }

        function showMessage2(data) {
            if( // validate min donate to show if any
                min_amount_to_show && 
                (parseFloat(data.amount) < min_amount_to_show) &&
                ['notif', 'replay'].includes(data.message)
            ) return;
            
            if (data.message == 'notif' && data.recipient_id == random_id || data.message == 'replay') {
                resetOverlay();
                uuidPush = data.uuid;
                
                // if custom
                const custom = get_custom_alert(data.amount);

                // media
                data.final_media = data.gif_link ? data.gif_link : src;
                if (custom && $('#custom-gif-' + custom.custom_alert_id).attr('src')) {
                    data.final_media = $('#custom-gif-' + custom.custom_alert_id).attr('src');
                }
                
                // content
                data.final_supporter = data.fullname;
                data.final_from_text = data.from_label;
                data.final_message = data.note;
                if(data.traktir_item && data.traktir_item != null && data.traktir_item != "") {
                    data.final_amount = data.qty + " "+ data.traktir_item;
                } else {
                    if(show_currency == 'show'){
                        data.final_amount = data.real_currency + data.real_amount; 
                    }else{
                        data.final_amount = data.real_amount;
                    }
                }

                if (data.voice_note != null || data.soundboard) {
                    data.display_wave = true;
                }

                //show element
                renderAlert(data);

                // custom sound
                let custom_sound = def_sound;
                if(data.soundboard){
                    custom_sound = data.soundboard;
                }

                var soundboard = null;
                if (custom) {
                    if(data.soundboard){
                        soundboard = data.soundboard;
                    }
                    
                    if (custom.sound_active == '1' && custom.sound_file) {
                        custom_sound = custom.sound_file;
                    } else custom_sound = '';
                }

                // override dengan voicy link if exist
                if (data.voicy_link) {
                    custom_sound = data.voicy_link;

                    (async () => {
                        try {
                            const respon = await $.post(`${base_url}tribe/socket/voicy_analytics`, {
                                voicy_link: data.voicy_link,
                                sb_token_csrf : $('#csrf').val(),
                            });
                            $('#csrf').val(respon.token);
                        } catch(e) {
                            // console.error('Voicy analytics failed:', e);
                        }
                    })();
                }

                if(data.voice_note != null) {
                    sound_new(i = -1, data.tts, data.voice_note, custom_sound, custom, soundboard, function() {
                        $('#main').hide();
                        sendFeedback();
                    });
                } else {
                    //play sound
                    sound_new(i = -1, data.tts, data.voice_note, custom_sound, custom, soundboard);
    
                    //hide element               
                    overlay_timeout = setTimeout(function() {
                        $('#main').hide();
                        sendFeedback();
                    }, duration_tag);
                }
            } else if (data.message == 'test') {
                resetOverlay();
                uuidPush = data.uuid;

                // media
                data.final_media = 'https://storage.sociabuzz.com/storage/img/gif/thanks.gif';

                // content
                data.final_supporter = data.fullname;
                data.final_from_text = data.from_label;
                data.final_message = data.note;

                if(data.traktir_item && data.traktir_item != null && data.traktir_item != "") {
                    data.final_amount = data.qty + " "+ data.traktir_item;
                } else {
                    if(show_currency == 'show'){
                        data.final_amount = data.real_currency + data.real_amount; 
                    }else{
                        data.final_amount = data.real_amount;
                    }
                }

                if (data.voice_note != null || data.soundboard) {
                    data.display_wave = true;
                }

                //show element
                renderAlert(data);

                if(data.voice_note != null) {
                    sound_new(i = -1, data.tts, data.voice_note, def_sound, null, null, function() {
                        $('#main').hide();
                        sendFeedback();
                    });
                } else {
                    //play sound
                    sound_new(i = -1, data.tts, data.voice_note, def_sound);
    
                    //hide element
                    overlay_timeout = setTimeout(function() {
                        $('#main').hide();
                        sendFeedback();
                    }, 12000);
                }
            }
        }

        // ably start
        const clientId = `${_id}_overlay`;
        const realtime = new Ably.Realtime.Promise({ 
            authUrl: `${base_url}ably/auth`,
            authParams: {
                clientId: clientId
            },
        });

        const channel = realtime.channels.get(_id);

        // presence
        channel.presence.enterClient(clientId);

        // on attached
        channel.once('attached', (stateChange) => {
            console.log('channel ' + channel.name + ' is now attached');
            checkPages().then((pages) => {

                }
            });
        });

        // subscriber
        channel.subscribe((message) => {
            let data = JSON.parse(message.data);
            showMessage2(data);
        });

        async function sendFeedback() {
            var client = {
                    user_id: _id,
                    recipient_id: 123,
                    message: 'feedback_overlay',
                    uuid: uuidPush,
                    sb_token_csrf : $('#csrf').val(),
                    ws: 'ably'
                };

                if(document.getElementById("main").style.display == 'none') {
                    setTimeout(() => {
                        var location=`${base_url}tribe/socket/sendfeedback/${_id}`;
                        $.post(location,client, function(respon){
                            $('#csrf').val(respon.token);
                        });	
                        console.log('progress: feedback sent');
                    }, 500);
                } else {
                    console.log('progress: feedback failed still displayed notif');
                }

            return true;
        }

        window.addEventListener('resize', _.debounce(function() {
            this.location.reload()
        }, 300));
        
        function checkPages(){
            var location=`${base_url}ably/presence/${_id}/overlay`;
            return new Promise((resolve, reject) => {
                setTimeout(() => {
                    $.get(location).done(function(respon){
                        console.log('Jumlah Pages:' + respon);
                        resolve(respon);
                    });
                }, 1000);
            });
        }
